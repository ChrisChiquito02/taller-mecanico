spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 1GB
  application:
    name: taller-mecanico-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/taller_mecanico?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:taller}
    password: ${SPRING_DATASOURCE_PASSWORD:cambia_esta_clave}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  jackson:
    time-zone: UTC
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${APP_JWT_SECRET:cambia-esta-clave-jwt-segura-de-al-menos-32-caracteres}
    expiration-minutes: 120
  reset-token-minutes: ${APP_RESET_TOKEN_MINUTES:30}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  postalkit:
    api-key: ${POSTALKIT_API_KEY:}
    base-url: ${POSTALKIT_BASE_URL:https://api.postalkit.mx}
  workshop:
    upload-dir: ${WORKSHOP_UPLOAD_DIR:/app/uploads}
